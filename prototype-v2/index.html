<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>荔枝组队 · Prototype v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="review-bar">
    <div class="review-label"><span class="review-dot"></span><b>荔枝组队</b><span>Prototype v2</span></div>
    <div class="review-actions"><span class="demo-notice">样例数据，仅演示交互</span><select id="party-demo" aria-label="当前队伍示例"><option value="party">3 人小队</option><option value="raid" selected>30 人团队</option></select><button id="replay">重播开窗</button><button id="reset">重置演示</button></div>
  </div>
  <main class="stage">
    <div class="fit-frame" id="fit-frame">
      <section class="window" id="window" aria-label="荔枝组队">
        <header class="app-header">
          <button class="brand" id="brand" aria-label="播放荔枝标志动画"><img id="logo" src="assets/lychee-logo.png" alt=""><span><em>荔枝</em> 组队</span></button>
          <nav class="main-nav" id="main-nav" aria-label="主导航"></nav>
          <div class="header-actions"><button data-page="settings" class="settings-button" aria-label="设置"></button><button id="close-window" class="icon-button" aria-label="关闭窗口"></button></div>
        </header>
        <div id="page" class="page"></div>
        <div id="toast" class="toast" role="status"></div>
        <div id="modal" class="modal-layer" hidden></div>
      </section>
      <div id="tooltip" class="lychee-tooltip" role="tooltip" hidden></div>
      <button id="open-window" class="reopen" hidden>打开荔枝组队</button>
    </div>
  </main>
  <footer class="review-footer"><span>可以切页、筛选队伍、悬停查看、申请、发布招募和编辑笔记。</span><span>先看体验，再定实现。</span></footer>
  <script src="app.js"></script>
</body>
</html>
