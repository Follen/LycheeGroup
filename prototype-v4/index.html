<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>荔枝组队 · 宽版交互原型</title>
  <link rel="stylesheet" href="base.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="overlays.css">
</head>
<body>
  <div class="review-bar">
    <div class="review-label"><b>荔枝组队</b><span>宽版原型 · 2026.10.18</span></div>
    <details class="review-controls"><summary>演示场景</summary><div class="review-actions"><span class="demo-notice">样例数据</span><select id="design-demo" aria-label="新版界面预览"><option value="">新版界面预览</option><option value="party-tip">小队寻队 Tooltip</option><option value="raid-tip">团本寻队 Tooltip</option><option value="party-applicants">小队申请列表</option><option value="raid-applicants">团本申请列表</option><option value="create">创建组队</option><option value="notes">荔枝笔记</option><option value="settings">设置</option><option value="join">入队后笔记播报</option></select><select id="application-demo" aria-label="申请场景示例"><option value="none">无申请</option><option value="two" selected>地下城 · 2 个申请</option><option value="mixed">跨分类 · 5 个申请</option><option value="five">地下城 · 5 个申请</option><option value="raid-two">团本 · 2 个申请</option><option value="raid-five">团本 · 5 个申请</option></select><select id="party-demo" aria-label="当前队伍示例"><option value="party" selected>3 人小队</option><option value="raid">30 人团队</option></select><select id="event-demo" aria-label="演示事件"><option value="">演示事件</option><option value="invite">原生邀请弹窗</option><option value="applicant">收到新申请</option></select><button id="demo-limit">满额提示</button><button id="replay">重播开窗</button><button id="reset">重置演示</button></div></details>
  </div>
  <main class="stage">
    <div class="fit-frame" id="fit-frame">
      <section class="window" id="window" aria-label="荔枝组队">
        <header class="app-header">
          <button class="brand" id="brand" aria-label="播放荔枝标志动画"><img id="logo" src="../prototype-v3/assets/lychee-logo.png" alt=""><span><em>荔枝</em> 组队</span></button>
          <nav class="main-nav" id="main-nav" aria-label="主导航"></nav>
          <div class="header-actions"><button data-page="settings" class="settings-button" aria-label="设置"></button><button id="close-window" class="icon-button" aria-label="关闭窗口"></button></div>
        </header>
        <div id="page" class="page"></div>
        <div id="toast" class="toast" role="status"></div>
        <div id="modal" class="modal-layer" hidden></div>
      </section>
      <aside id="search-filters" class="search-sidebar" aria-label="筛选队伍" hidden></aside>
      <div id="tooltip" class="lychee-tooltip" role="tooltip" hidden></div>
      <button id="open-window" class="reopen" hidden>打开荔枝组队</button>
    </div>
  </main>
  <div id="group-context-menu" class="group-context-menu" role="menu" aria-label="队伍操作" hidden></div>
  <aside id="floating-widget" class="floating-widget" aria-label="荔枝组队悬浮窗"></aside>
  <aside id="floating-recruit-widget" class="floating-widget" aria-label="招募状态悬浮窗预览"></aside>
  <div id="native-invite-layer" class="native-invite-layer" hidden></div>
  <aside id="join-notice" class="join-notice" role="status" aria-label="入队笔记提醒" hidden></aside>
  <audio id="applicant-audio" preload="none" hidden></audio>
  <footer class="review-footer"><span>队伍列表：单击选中，双击申请，右键查看更多操作。</span><span>原型使用样例数据</span></footer>
  <script src="controls.js"></script>
  <script src="app.js"></script>
</body>
</html>
