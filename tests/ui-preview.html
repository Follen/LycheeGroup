<!doctype html><meta charset="utf-8"><title>荔枝组队 · 本地布局预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1b2230;color:#e6eaf0;font:14px 'Microsoft YaHei',sans-serif}header{min-height:64px;flex-wrap:wrap;padding:12px 20px;display:flex;align-items:center;gap:7px}button{flex-shrink:0;font:inherit;background:#303c4f;color:inherit;border:0;border-radius:5px;padding:8px 13px;cursor:pointer}button.active{background:#d53c49}small{margin-left:auto;color:#9dacbf;font-size:12px}#viewport{overflow:auto}#stage{position:relative;width:1280px;height:860px;margin:auto;background:radial-gradient(ellipse at 65% 30%,#303a4b,#17202b 65%)}.node{position:absolute;white-space:pre;overflow:hidden;pointer-events:none;font-family:'Microsoft YaHei',sans-serif;line-height:1.2}.icon{display:flex;align-items:center;justify-content:center;color:#e6edf3;font-size:10px;border-radius:3px;border:1px solid #ffffff23}.atlas{color:#bdcfe0}.label{display:flex;align-items:center}.multiline{white-space:pre-wrap;overflow-wrap:break-word;display:block}
</style><header id="tabs"><small>本地样例 · 原生图标为占位 · 非游戏截图</small></header><div id="viewport"><div id="stage"></div></div>
<script src="preview-data.js"></script><script>
const stage=document.getElementById('stage'),tabs=document.getElementById('tabs');const ctx=document.createElement('canvas').getContext('2d');
const strip=s=>(s||'').replace(/\|c[0-9a-f]{8}|\|r/gi,'');
function rgba(c){return c?`rgba(${c.slice(0,3).map(x=>Math.round(x*255)).join(',')},${c[3]??1})`:''}
function styled(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\|c([0-9a-f]{2})([0-9a-f]{6})/gi,(_,a,c)=>`<span style="color:#${c}">`).replace(/\|r/g,'</span>')}
function factors(p){return [p.includes('LEFT')?0:p.includes('RIGHT')?1:.5,p.includes('TOP')?0:p.includes('BOTTOM')?1:.5]}
function render(index){
stage.replaceChildren();const shot=SHOTS[index],ns=shot.nodes;const cache={},busy=new Set();
function scale(n){return (n.scale||1)*(n.parent?scale(ns[n.parent-1]):1)}
function measure(n,width){const size=n.font?.[1]||14;ctx.font=`${size}px Microsoft YaHei`;const text=strip(n.text);let lines=0,max=0;for(const line of text.split('\n')){const w=ctx.measureText(line).width;max=Math.max(max,w);lines+=n.wrap&&width>0?Math.max(1,Math.ceil(w/width)):1;}if(n.maxLines)lines=Math.min(lines,n.maxLines);return [Math.ceil(max),lines*(size*1.2+(n.spacing||0))];}
function pos(id){if(cache[id])return cache[id];const n=ns[id-1];if(!n)return [0,0,0,0];if(busy.has(id))return [0,0,n.w||0,n.h||0];busy.add(id);
if(n.all){cache[id]=pos(n.all).slice();busy.delete(id);return cache[id];}
const factor=scale(n);let w=(n.w||0)*factor,h=(n.h||0)*factor;const points=Object.values(n.points||{}).map(p=>{let ref=n.parent,rp=p[0],x=0,y=0;if(typeof p[1]==='object'){ref=p[1].ref;rp=p[2]||p[0];x=p[3]||0;y=p[4]||0;}else if(typeof p[1]==='number'){x=p[1];y=p[2]||0;}else if(typeof p[1]==='string'){rp=p[2]||p[0];x=p[3]||0;y=p[4]||0;}const b=pos(ref),af=factors(p[0]),rf=factors(rp);return [af[0],af[1],b[0]+b[2]*rf[0]+x*factor,b[1]+b[3]*rf[1]-y*factor];});
if(points.length>1){for(const p of points.slice(1)){const q=points[0];if(p[0]!==q[0])w=(p[2]-q[2])/(p[0]-q[0]);if(p[1]!==q[1])h=(p[3]-q[3])/(p[1]-q[1]);}}
if(n.kind==='FontString'||n.kind==='EditBox'){const m=measure(n,w/factor);w=w||m[0]*factor;h=h||m[1]*factor;}
let x=0,y=0;if(points.length){x=points[0][2]-w*points[0][0];y=points[0][3]-h*points[0][1];}else if(n.parent){[x,y]=pos(n.parent);}
if(n.parent&&ns[n.parent-1].scrollChild===id)y-=(ns[n.parent-1].scroll||0)*scale(ns[n.parent-1]);
if(id===shot.tooltip){x=Math.max(0,Math.min(1280-w,x));y=Math.max(0,Math.min(860-h,y));}
cache[id]=[x,y,Math.max(0,w),Math.max(0,h)];busy.delete(id);return cache[id];}
function visible(n){return n.kind!=='MaskTexture'&&n.shown!==false&&(!n.parent||visible(ns[n.parent-1]));}
function within(n,id){return n.id===id||n.parent&&within(ns[n.parent-1],id)}
function strata(n){return n.strata||(n.parent?strata(ns[n.parent-1]):'MEDIUM')}
function level(n){return n.level??(n.parent?level(ns[n.parent-1])+(n.kind==='FontString'||n.kind==='Texture'?0:1):0)}
function alpha(n){const vertexSurface=n.texture===130871||typeof n.texture==='string'&&(n.texture.includes('rounded-corner')||n.texture.includes('WHITE8X8'));return (vertexSurface&&n.vertex?1:n.alpha??1)*(n.parent?alpha(ns[n.parent-1]):1)}
const ordered=ns.filter(n=>visible(n)&&(within(n,shot.root)||shot.tooltip&&within(n,shot.tooltip)||shot.menu&&within(n,shot.menu))).sort((a,b)=>{const key=n=>({BACKGROUND:0,LOW:1,MEDIUM:2,HIGH:3,DIALOG:4,FULLSCREEN:5,FULLSCREEN_DIALOG:6,TOOLTIP:7}[strata(n)]||0)*10000+level(n)*10+(n.kind==='EditBox'?5:({BACKGROUND:0,ARTWORK:3,OVERLAY:5}[n.layer]||0));return key(a)-key(b)||a.id-b.id;});
for(const n of ordered){const [x,y,w,h]=pos(n.id);if(!(w>0&&h>0))continue;const textKind=n.kind==='FontString'||n.kind==='EditBox';if(!textKind&&!n.fill&&!n.backdrop&&!n.texture&&!n.atlas)continue;const el=document.createElement('div');el.className='node';Object.assign(el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',opacity:alpha(n)});
let clip=[x,y,x+w,y+h];for(let p=n.parent;p;p=ns[p-1].parent){const parent=ns[p-1];if(parent.kind==='ScrollFrame'){const [cx,cy,cw,ch]=pos(p);clip=[Math.max(clip[0],cx),Math.max(clip[1],cy),Math.min(clip[2],cx+cw),Math.min(clip[3],cy+ch)];}}if(clip[0]>=clip[2]||clip[1]>=clip[3])continue;el.style.clipPath=`inset(${clip[1]-y}px ${x+w-clip[2]}px ${y+h-clip[3]}px ${clip[0]-x}px)`;
if(n.rotation)el.style.transform=`rotate(${-n.rotation}rad)`;
if(n.fill)el.style.background=rgba(n.fill);if(n.backdrop)el.style.background=rgba(n.backdrop);
if(textKind){el.classList.add('label');if(n.wrap)el.classList.add('multiline');el.innerHTML=styled(n.text);el.style.fontSize=((n.font?.[1]||14)*scale(n))+'px';el.style.color=rgba(n.color)||'#eee';el.style.textAlign=(n.justify||'LEFT').toLowerCase();el.style.justifyContent=n.justify==='RIGHT'?'flex-end':n.justify==='CENTER'?'center':'flex-start';if(n.spacing)el.style.lineHeight=(((n.font?.[1]||14)*1.2+n.spacing)*scale(n))+'px';}
if(n.texture&&typeof n.texture==='string'&&n.texture.includes('lychee-logo')){el.style.background='url(../addon/LycheeGroup_UI/Media/lychee-logo.png) center/contain no-repeat';}
else if(n.texture&&typeof n.texture==='string'&&n.texture.includes('faction-')){const faction=n.texture.includes('alliance')?'alliance':'horde';el.style.background=`url(../assets/factions/${faction}.png) center/contain no-repeat`;}
else if(n.texture&&typeof n.texture==='string'&&n.texture.includes('favorite-')){const state=n.texture.includes('favorite-on')?'on':'off';el.style.background=`url(../assets/favorites/favorite-${state}.png) center/contain no-repeat`;}
else if(n.texture&&typeof n.texture==='string'&&n.texture.includes('rounded-corner')){el.style.background=rgba(n.vertex);const c=n.coords||[0,1,0,1];el.style.borderRadius=c[0]===0?(c[2]===0?'100% 0 0 0':'0 0 0 100%'):(c[2]===0?'0 100% 0 0':'0 0 100% 0');}
else if(n.texture===130871||typeof n.texture==='string'&&n.texture.includes('WHITE8X8')){el.style.background=rgba(n.vertex)||'white';}
else if(typeof n.texture==='string'&&n.texture.includes('shadow')){continue;}
else if(typeof n.texture==='string'&&n.texture.includes('chevron.tga')){el.textContent='›';el.style.color=rgba(n.vertex)||'#c4c4c4';el.style.fontSize=(h+4)+'px';el.style.lineHeight=h+'px';el.style.textAlign='center';}
else if(n.texture||n.atlas){el.classList.add('icon');let label='◇',bg='#354c61';const a=n.atlas||'';if(a.includes('Tank'))label='盾';else if(a.includes('Healer'))label='+';else if(a.includes('DPS'))label='刃';else if(a.includes('emptyslot')){label='';bg='#223041';}else if(n.coords){label='◆';bg=['#806d4b','#b8759c','#387796','#806e91'][Math.round((n.coords[2]||0)*8)%4];}el.textContent=label;el.style.background=bg;el.style.fontSize=Math.min(13*scale(n),w*.7)+'px';}
stage.append(el);}
document.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===index));window.currentLayout=index;
}
SHOTS.forEach((shot,i)=>{const b=document.createElement('button');b.textContent=shot.name;b.onclick=()=>render(i);tabs.insertBefore(b,tabs.lastElementChild)});render(0);
</script>
