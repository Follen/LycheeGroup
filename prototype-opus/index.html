<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>荔枝组队 · 交互原型 03</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="review-bar">
    <div class="review-label"><span class="review-dot"></span><b>荔枝组队</b><span>交互原型 · 03（Opus）</span></div>
    <div class="review-actions">
      <span class="demo-notice">样例数据，仅演示交互</span>
      <label class="review-field">当前队伍
        <select id="party-demo">
          <option value="solo">单人</option>
          <option value="party" selected>2 人小队</option>
          <option value="raid">30 人团队</option>
        </select>
      </label>
      <label class="review-check"><input type="checkbox" id="sim-toggle" checked>模拟申请到达</label>
      <button id="sim-now">来一组申请</button>
      <button id="replay">重播开窗</button>
      <button id="reset">重置演示</button>
    </div>
  </div>
  <main class="stage">
    <div class="fit-frame" id="fit-frame">
      <section class="window" id="window" aria-label="荔枝组队">
        <header class="app-header">
          <button class="brand" id="brand" aria-label="播放荔枝标志动画"><img id="logo" src="assets/lychee-logo.png" alt=""><span><em>荔枝</em>组队</span></button>
          <nav class="main-nav" id="main-nav" aria-label="主导航"></nav>
          <div class="header-actions">
            <button class="settings-button" data-page="settings">设置</button>
            <button id="close-window" class="icon-button" aria-label="关闭窗口"><img class="i" src="assets/icons/close.png" alt=""></button>
          </div>
        </header>
        <div id="page" class="page"></div>
        <div id="toast" class="toast" role="status"></div>
        <div id="modal" class="modal-layer" hidden></div>
      </section>
      <div id="tooltip" class="lychee-tooltip" role="tooltip" hidden></div>
      <button id="open-window" class="reopen" hidden>打开荔枝组队</button>
    </div>
  </main>
  <footer class="review-footer"><span>重点：创建组队（填写 → 实时预览 → 发布）与发布后的等待申请、邀请、补位流程。</span><span>Esc 关闭窗口 · 悬停团本队伍时按住 Shift 查看成员</span></footer>
  <script src="app.js"></script>
</body>
</html>
